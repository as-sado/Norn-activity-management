[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "norn"
version = "0.1.0"
description = "Application time tracker for Linux and Hyprland"
requires-python = ">=3.13"

dependencies = [
    "aiosqlite",
    "textual"
]


[project.scripts]
norn = "norn.main:main"
norn-daemon = "norn.run_app:run_app"


[tool.setuptools.packages.find]
where = ["src"]